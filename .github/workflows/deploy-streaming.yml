name: Deploy Streaming Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT && secrets.SERVER_SSH_PORT || '22' }}
          script: |
            set -e

            REPO_DIR="/opt/moviebox/repo"
            BUILD_DIR="/opt/moviebox/streaming"

            # Pull latest code
            cd "$REPO_DIR"
            git pull origin main

            # --- Laravel ---
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # --- Go streaming service ---
            cd "$REPO_DIR/moviebox_streaming"
            go build -o "$BUILD_DIR/streaming" .

            sudo systemctl restart moviebox-streaming.service
            sudo systemctl is-active --quiet moviebox-streaming.service && echo "Streaming service restarted successfully"
